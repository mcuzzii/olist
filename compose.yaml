services:

  db:
    image: postgres:17

    environment:
      POSTGRES_DB: olist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/raw:/data/raw:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  downloader:
    build:
      context: ./docker/downloader

    environment:
      KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN:-}
      KAGGLE_DATASET: olistbr/brazilian-ecommerce

    volumes:
      - ./data/raw:/data/raw

    command: ["python", "download.py"]
  

  sql-runner:
    build:
      context: ./docker/sql-runner

    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: olist
      PGUSER: postgres
      PGPASSWORD: ${PG_PASSWORD}

    volumes:
      - ./sql:/sql:ro
      - ./data/raw:/data/raw:ro

    depends_on:
      db:
        condition: service_healthy

    command: ["sleep", "infinity"]


volumes:
  postgres_data: